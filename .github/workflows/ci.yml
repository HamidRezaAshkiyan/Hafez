name: Hafez CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore HafezLibrary/HafezLibrary.csproj
          dotnet restore HafezWPFUI/HafezWPFUI.csproj
          dotnet restore HafezLibrary.Tests/HafezLibrary.Tests.csproj

      - name: Build HafezLibrary (Release)
        run: dotnet build HafezLibrary/HafezLibrary.csproj --configuration Release --no-restore

      - name: Build HafezWPFUI (Release)
        run: dotnet build HafezWPFUI/HafezWPFUI.csproj --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test HafezLibrary.Tests/HafezLibrary.Tests.csproj --configuration Release --no-restore --verbosity normal
