name: Release Hafez

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Tests
        run: dotnet test HafezLibrary.Tests/HafezLibrary.Tests.csproj --configuration Release

      - name: Publish Windows x64 Self-Contained
        run: >
          dotnet publish HafezWPFUI/HafezWPFUI.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o publish/Hafez-win-x64

      - name: Create Release Archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { $tag = "v2.0.0" }
          Compress-Archive -Path publish/Hafez-win-x64/* -DestinationPath "Hafez-$tag-win-x64.zip" -Force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: Hafez-*.zip
          generate_release_notes: true
